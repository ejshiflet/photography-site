{% extends 'layout.html' %}

{% block content %}

            <section id="testimonials">
                <div class="splide testimonial-slider" role="group" aria-label="home-carousel">
                    <div class="splide__track">
                        <ul class="splide__list">
                            {% for row in testimonials %}
                            <li class="splide__slide">
                                <!-- row[0] extracts the exact text filename string from the SQL tuple row -->
                                <div class="image-container">
                                    <img class="slide-img" src="{{ url_for('static', filename='photos/' + row[0]) }}" alt="Studio Showcase Portfolio Photo">
                                        <div class="text-overlay">
                                        <h2>Testimonials</h2>
                                        <p>"{{ row[2] }}"</p>
                                        <h3>{{ row[1] }}</h3>
                                    </div>
                                </div>
                            </li>
                            {% endfor %}
                        </ul>
                    </div>
                </div>
            </section>

{% endblock %}
