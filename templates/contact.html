{% extends 'layout.html' %}

{% block content %}

            <section id="contact">
                <h1>Let's Connect</h1>
                <h2>For any questions or bookings contact me using the form below! I typically respond within 48 hours.</h2>
                <p>Email: Shifletstudios@gmail.com</p>
                <div id="contact-form-container">
                    <form class="contact-form">
                        <label for="first-name">First Name</label>
                        <input id="first-name" type="text" autocomplete="given-name" required>

                        <label for="last-name">Last Name</label>
                        <input id="last-name" type="text" autocomplete="family-name" required>

                        <label for="email">Email</label>
                        <input id="email" type="email" autocomplete="email" required>

                        <label for="user-message">Your Message</label>
                        <textarea id="user-message" type="text" rows="5" required></textarea>
                        <button type="submit" id="contact-send-message-btn">Send Message</button>
                </form>
                </div>
            </section>

{% endblock %}
